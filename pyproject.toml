[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finevidence"
version = "0.1.0"
description = "Evidence-grounded financial question answering with numerical reasoning."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "FinEvidence contributors" }]
# sympy: program accuracy needs symbolic equivalence, as in the official FinQA evaluator.
# It is pure Python (plus mpmath) and downloads nothing at setup.
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
research = [
  "ipykernel>=6.29",
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finevidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
