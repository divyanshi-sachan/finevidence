# Notebook 16 (M4 iteration 3): a decoder-only LLM program generator, fine-tuned with LoRA.
# Same inputs and targets as Notebook 11 (question plus top-5 retrieved facts -> FinQA program);
# only the generator changes. Planned settings, not results. Test is not loaded.
experiment_name = "generator-qwen2.5-1.5b-lora-v1"
seed = 42
dataset_root = "data/raw"
train_split = "train"
evaluation_split = "dev"

[model]
pretrained_name = "Qwen/Qwen2.5-1.5B-Instruct"
# Instruction plus source; truncated from the end, which drops the lowest-ranked facts first.
max_source_tokens = 512
max_new_tokens = 64

[lora]
rank = 16
alpha = 32
dropout = 0.05

[training]
facts_per_input = 5
epochs = 3
micro_batch_size = 4
gradient_accumulation = 4
learning_rate = 2e-4
warmup_ratio = 0.03

[generation]
num_beams = 4
eval_batch_size = 8

[inputs]
rankings_path = "data/processed/retriever_bert_base_dev_rankings.jsonl"
rankings_sha256 = "d6c31f86c1fd4ab0d68d2cb56996ffe9705fba7dfbfe62464fd7b0ea7bd562e6"

[output]
model_dir = "models/generator-qwen2.5-1.5b-lora-v1"
predictions_dir = "data/processed"
